# node_modules tradicional: Next.js, Storybook e Vitest funcionam sem ajustes.
nodeLinker: node-modules
enableTelemetry: false

# O Yarn só instala versões publicadas há mais de 24h. Estas versões foram
# fixadas de propósito ao criar o projeto e ficam fora dessa regra.
npmPreapprovedPackages:
  - "next@16.4.1"
  - "@next/*@16.4.1"
  - "eslint-config-next@16.4.1"
  - "react@19.3.1"
  - "react-dom@19.3.1"
  - "lucide-react@1.57.0"
